services:
  - type: web
    name: stylehub-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://stylehub-backend-gu04.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html